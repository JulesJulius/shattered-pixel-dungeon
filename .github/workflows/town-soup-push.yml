name: Town Soup Push Build

on:
  push:
    branches:
      - chatgpt/town-soup-vertical-slice-20260720

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract and apply embedded vertical-slice patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, gzip
          text = Path('.github/workflows/town-soup-vertical-slice.yml').read_text()
          match = re.search(r"printf '%s' '([^']+)' \| base64", text)
          if not match:
              raise SystemExit('Embedded patch was not found')
          Path('/tmp/town-soup.patch').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          git apply --check /tmp/town-soup.patch
          git apply /tmp/town-soup.patch

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        shell: bash
        run: ./gradlew --no-daemon :android:assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifact
          cp android/build/outputs/apk/debug/*.apk artifact/town-soup-prototype-debug.apk
          sha256sum artifact/town-soup-prototype-debug.apk > artifact/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: town-soup-prototype-debug
          path: artifact/
          if-no-files-found: error
