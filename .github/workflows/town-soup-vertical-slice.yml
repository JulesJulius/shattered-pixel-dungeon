name: Town Soup Vertical Slice

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply Town Soup vertical-slice patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/town-soup.patch
          git apply --check /tmp/town-soup.patch
          git apply /tmp/town-soup.patch

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        shell: bash
        run: ./gradlew --no-daemon :android:assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifact
          cp android/build/outputs/apk/debug/*.apk artifact/town-soup-prototype-debug.apk
          sha256sum artifact/town-soup-prototype-debug.apk > artifact/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: town-soup-prototype-debug
          path: artifact/
          if-no-files-found: error
